name: map_location_picker
description: Google Map location picker for flutter Based on google_maps_flutter.
version: 1.0.1
homepage: https://github.com/rvndsngwn/map_location_picker

environment:
  sdk: ">=2.17.5 <3.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.17.1

  form_builder_extra_fields: ^12.2.0
  google_maps_webservice: ^0.0.19
  google_maps_flutter_web: ^0.6.2+3
  geolocator: ^14.0.2
  provider: ^6.1.5+1
  http: ^1.6.0
  logger: ^2.7.0
  flutter_easyloading: ^3.0.5

dependency_overrides:
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

